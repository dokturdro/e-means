[project]
name = "e-means"
version = "0.1.0"
description = "A minimal e-means implementation compared with Lloyd's k-means on SIFT1M."
requires-python = ">=3.11"
dependencies = ["matplotlib", "numpy", "torch"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
